<body>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF;--ink:#16161D;--sub:#55566A;--soft:#F3F3F7;--line:#DADAE3;
  --ok:#2BD17E;--ok-soft:#DDF8EA;--ng:#FF5A5A;--ng-soft:#FFE3E3;--gold:#FFC62E;--fire:#FF7A2F;
  --r:16px;--sh:0 4px 0 var(--ink);
  --zh:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --jp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--zh);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.jp{font-family:var(--jp)}
.num{font-variant-numeric:tabular-nums;font-family:var(--jp);font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #4CB8FF;outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}

/* chunky buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--ink);border-radius:14px;background:var(--bg);box-shadow:var(--sh);padding:9px 16px;font-weight:700;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.big{padding:13px 20px;font-size:17px}
.btn.dark{background:var(--ink);color:#fff}
.btn.yellow{background:var(--gold)}
.btn.small{padding:5px 11px;font-size:13px;box-shadow:0 3px 0 var(--ink);border-width:2px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2.5px solid var(--ink)}
.hud-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:900;font-family:"Noto Sans TC",var(--zh);font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.logo b{background:var(--ink);color:#fff;border-radius:8px;padding:1px 7px;font-family:var(--jp);font-size:14px}
.hud-stats{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:2px 10px 2px 4px;font-size:13px;font-weight:700;background:var(--bg)}
.chip i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-family:var(--jp);font-weight:800}
.lv i{background:var(--ink);color:#fff}
.xpbar{width:60px;height:8px;border-radius:9px;background:var(--soft);border:1.5px solid var(--ink);overflow:hidden}
.xpbar span{display:block;height:100%;background:var(--gold)}
.streak i{background:var(--fire);color:#fff}
.mast i{background:var(--ok);color:var(--ink)}
.mute{border:2px solid var(--ink);background:var(--bg);border-radius:10px;width:32px;height:30px;display:grid;place-items:center;padding:0}
@media (max-width:560px){.hud-stats .xpbar{display:none}.logo span{display:none}}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin:22px 0 18px}
.bubble{position:relative;border:2.5px solid var(--ink);border-radius:18px;padding:12px 16px;background:var(--bg);box-shadow:var(--sh)}
.bubble::before{content:"";position:absolute;left:-11px;top:26px;width:16px;height:16px;background:var(--bg);border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.bubble .jp{font-size:19px;font-weight:800;display:block;line-height:1.35}
.bubble small{color:var(--sub);font-size:14px}
.mascot{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.quick{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:28px}
.quick .btn{flex-direction:column;gap:2px;padding:14px 10px;white-space:normal;text-align:center;line-height:1.25}
.quick .btn small{font-weight:500;font-size:12px;opacity:.8}
.quick .go{background:var(--ok);font-size:19px}
.quick .blitz{background:#4CB8FF}
.quick .rev{background:#FF8CC6}
@media (max-width:520px){.quick{grid-template-columns:1fr 1fr}.quick .go{grid-column:1/-1}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-h h2{margin:0;font-size:22px;font-family:"Noto Sans TC",var(--zh);font-weight:900}
.sec-h span{color:var(--sub);font-size:13px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ch{position:relative;text-align:left;border:2.5px solid var(--ink);border-radius:var(--r);background:var(--bg);box-shadow:var(--sh);padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;transition:transform .12s}
.ch:hover{transform:translateY(-3px) rotate(-.4deg)}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ch .g{grid-row:1/3;width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--jp);font-weight:800;font-size:26px;background:var(--c)}
.ch .t{font-weight:700;font-size:16px;line-height:1.25}
.ch .s{font-size:12px;color:var(--sub)}
.ch .meter{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:700}
.meter .bar{flex:1;height:10px;border:2px solid var(--ink);border-radius:9px;overflow:hidden;background:var(--soft)}
.meter .bar span{display:block;height:100%;background:var(--c)}
.ch .no{position:absolute;top:-10px;right:12px;background:var(--ink);color:#fff;font-family:var(--jp);font-weight:800;font-size:11px;border-radius:999px;padding:1px 8px}
.ch .done{position:absolute;top:-12px;left:-8px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;font-size:11px;font-weight:800;padding:0 7px;transform:rotate(-8deg)}
.foot{margin-top:34px;color:var(--sub);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* chapter path */
.chap-head{display:flex;align-items:center;gap:14px;margin:18px 0 8px;flex-wrap:wrap}
.chap-head .g{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--jp);font-weight:800;font-size:32px;background:var(--c);box-shadow:var(--sh)}
.chap-head h1{margin:0;font-size:26px;font-family:"Noto Sans TC",var(--zh);font-weight:900;line-height:1.2}
.chap-head p{margin:0;color:var(--sub);font-size:14px}
.path{position:relative;display:grid;gap:10px;padding:18px 0 10px;background-image:radial-gradient(circle,var(--line) 2px,transparent 2.5px);background-size:22px 22px;border:2.5px dashed var(--line);border-radius:24px;margin-top:10px}
.node-row{display:flex;justify-content:center}
.node-w{position:relative;left:calc(var(--x) * 1%);display:grid;justify-items:center;gap:4px}
.node{width:76px;height:76px;border-radius:50%;border:3px solid var(--ink);background:var(--c);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;font-family:var(--jp);font-weight:800;font-size:28px;transition:transform .08s,box-shadow .08s}
.node:active:not(:disabled){transform:translateY(6px);box-shadow:0 0 0 var(--ink)}
.node.locked{background:var(--soft);color:#A6A7B5;border-color:#A6A7B5;box-shadow:0 6px 0 #A6A7B5}
.node.cur{animation:hop 1.4s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}60%{transform:translateY(-2px)}}
.node.boss{width:92px;height:92px;background:var(--ink);color:#fff;font-size:30px;border-radius:26px;transform:rotate(45deg)}
.node.boss span{transform:rotate(-45deg)}
.node.boss.locked{background:var(--soft);color:#A6A7B5}
.node.boss.cur{animation:none}
.flag{position:absolute;top:-30px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:2px 9px;white-space:nowrap;z-index:2}
.flag::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.nstars{font-size:15px;letter-spacing:1px;color:var(--gold);-webkit-text-stroke:1px var(--ink);height:18px}
.nstars .e{color:#fff}
.nlabel{font-size:12px;font-weight:700;color:var(--sub)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(22,22,29,.45);z-index:40;display:grid;place-items:end center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;border:3px solid var(--ink);border-radius:22px;background:var(--bg);box-shadow:0 6px 0 var(--ink);padding:18px;display:grid;gap:12px;animation:up .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes up{from{transform:translateY(40px)}}
.sheet h3{margin:0;font-size:20px;font-family:"Noto Sans TC",var(--zh);font-weight:900}
.sheet .rules{display:flex;gap:8px;flex-wrap:wrap}
.sheet .rules span{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:2px solid var(--ink);border-radius:10px;padding:1px 9px;font-family:var(--jp);font-weight:700;font-size:15px;background:var(--bg)}
.sheet .act{display:flex;gap:10px;flex-wrap:wrap}
.sheet .act .btn{flex:1}

/* play */
.top{display:flex;align-items:center;gap:10px;margin:12px 0}
.top .ttl{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hearts{font-size:22px;letter-spacing:1px;color:var(--ng);-webkit-text-stroke:1.5px var(--ink);white-space:nowrap}
.hearts .e{color:#fff}
.hearts.hit{animation:shake .4s}
.pills{display:flex;gap:5px}
.pills span{flex:1;height:12px;border-radius:6px;border:2px solid var(--ink);background:var(--soft)}
.pills .ok{background:var(--ok)}.pills .ng{background:var(--ng)}.pills .cur{background:var(--gold)}
.statrow{display:flex;align-items:center;gap:10px;margin:12px 0;min-height:30px}
.score{margin-left:auto;font-size:22px}
.combo{border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-weight:800;font-family:var(--jp);background:var(--gold);animation:pop .3s}
.combo.fever{background:var(--fire);color:#fff;animation:pop .3s,glow 1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(255,122,47,.25)}}
.card{position:relative;border:3px solid var(--ink);border-radius:22px;background:var(--bg);box-shadow:0 6px 0 var(--ink);overflow:hidden}
.card .band{display:flex;align-items:center;gap:8px;background:var(--c);border-bottom:3px solid var(--ink);padding:8px 12px;font-weight:700;font-size:14px}
.card .band .m{margin-left:auto;margin-block:-14px -10px}
.card .body{padding:22px 16px 24px;text-align:center;display:grid;justify-items:center;gap:8px}
.prompt{font-size:clamp(38px,11vw,66px);line-height:1.15;font-weight:800;overflow-wrap:anywhere}
.prompt.zh{font-family:"Noto Sans TC",var(--zh);font-weight:900;font-size:clamp(28px,8vw,46px)}
.prompt.long{font-size:clamp(26px,7vw,40px)}
.say{border:2px solid var(--ink);border-radius:999px;background:var(--bg);padding:3px 14px;font-size:13px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.say:active{transform:translateY(3px);box-shadow:none}
.card.pop{animation:pop .35s}
.card.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.opt{position:relative;min-height:66px;border:2.5px solid var(--ink);border-radius:16px;background:var(--bg);box-shadow:var(--sh);padding:10px 12px 10px 38px;text-align:left;font-size:18px;font-weight:700;display:flex;align-items:center;overflow-wrap:anywhere;transition:transform .08s,box-shadow .08s,background .15s}
.opt.jpa{font-family:var(--jp);font-size:22px;font-weight:800}
.opt kbd{position:absolute;left:10px;top:50%;margin-top:-11px;width:20px;height:22px;border-radius:6px;background:var(--soft);font:700 12px/22px var(--jp);text-align:center;color:var(--sub)}
.opt:hover:not(:disabled){background:#FFF8DD}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.opt.right{background:var(--ok);animation:pop .3s}
.opt.wrong{background:var(--ng);color:#fff;animation:shake .4s}
.opt.right kbd,.opt.wrong kbd{background:rgba(255,255,255,.6);color:var(--ink)}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}
@media (max-width:420px){.opt{font-size:16px;min-height:60px}.opt.jpa{font-size:19px}}
.fb{margin-top:16px;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;animation:up .22s cubic-bezier(.2,1.4,.4,1)}
.fb.ok{background:var(--ok-soft)}.fb.ng{background:var(--ng-soft)}
.fb .h{font-weight:900;font-family:"Noto Sans TC",var(--zh);font-size:15px}
.fb .w{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.fb .w .big{font-size:26px;font-weight:800}
.fb .w .k{font-size:17px;font-weight:700}
.fb .w .r{font-size:13px;color:var(--sub)}
.fb .z{font-size:15px}
.pos{display:inline-block;font-size:11px;font-weight:700;border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;margin-left:6px;background:var(--bg);vertical-align:2px}
.fb .a{grid-row:1/4;grid-column:2;display:grid;gap:8px}
.float{position:fixed;pointer-events:none;font-family:var(--jp);font-weight:800;font-size:26px;color:var(--ink);-webkit-text-stroke:0;z-index:50;animation:rise .9s ease-out forwards}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}
.timer{height:16px;border:2.5px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--soft);flex:1}
.timer span{display:block;height:100%;background:#4CB8FF;transition:width .1s linear}
.timer.low span{background:var(--ng)}
.tnum{font-size:24px;min-width:44px;text-align:right}

/* result */
.result{display:grid;justify-items:center;gap:16px;text-align:center;padding-top:14px}
.result h1{margin:0;font-family:"Noto Sans TC",var(--zh);font-weight:900;font-size:32px}
.bigstars{display:flex;gap:10px;font-size:52px;line-height:1;-webkit-text-stroke:2px var(--ink)}
.bigstars span{color:#fff;transform:scale(0);animation:starin .45s cubic-bezier(.2,1.6,.4,1) forwards}
.bigstars span.on{color:var(--gold)}
.bigstars span:nth-child(2){animation-delay:.25s;transform:scale(0) translateY(-10px)}
.bigstars span:nth-child(3){animation-delay:.5s}
@keyframes starin{to{transform:scale(1)}}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:440px}
.tiles div{border:2.5px solid var(--ink);border-radius:14px;padding:8px 4px;display:grid;box-shadow:0 3px 0 var(--ink)}
.tiles b{font-size:24px}
.tiles span{font-size:12px;color:var(--sub);font-weight:700}
.lvup{background:var(--gold);border:2.5px solid var(--ink);border-radius:999px;padding:4px 16px;font-weight:900;animation:pop .5s .6s both}
.miss{width:100%;max-width:480px;display:grid;gap:8px;text-align:left}
.miss h3{margin:0;font-size:15px}
.miss li{list-style:none;display:grid;grid-template-columns:1.1fr 1fr 1.2fr;gap:8px;align-items:center;border:2px solid var(--ink);border-radius:12px;padding:6px 12px}
.miss ul{margin:0;padding:0;display:grid;gap:6px}
.miss .jp{font-weight:800;font-size:18px}
.ract{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* list */
.tbl{overflow-x:auto;border:2.5px solid var(--ink);border-radius:16px;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:9px 12px;text-align:left;border-bottom:1.5px solid var(--line)}
th{font-size:12px;background:var(--soft);color:var(--sub)}
tr:last-child td{border-bottom:0}
td.jw{font-family:var(--jp);font-weight:800;font-size:19px}
td.jk{font-family:var(--jp);font-weight:500}
td.r{color:var(--sub);font-size:13px}
.m-dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:var(--soft)}
.m-dot.on{background:var(--ok)}

/* levels (legacy) */
.lvnote{margin:12px 0 0;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700}
.lvtag{font-family:var(--jp);font-weight:800;font-size:11px;background:var(--bg);border:2px solid var(--ink);border-radius:999px;padding:0 7px}
/* hall */
.hall-hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin:22px 0 22px}
.hall-hero .bubble b{font-size:15px}
.hall{display:grid;gap:12px}

<script>
/* ===== 編織日和遊戲｜GA4 統一追蹤 v1.0 =====
   各遊戲完全相同，只改最上面三行。規範：games-ga4-guideline
   注意：整段不含「和號」字元與雙斜線註解，新增程式時請維持 */
var HY_GAME_ID = 'jlpt_mishitsu';  /* 遊戲登記表的 game_id */
var HY_GAME_ROOT = '#app, .veil';  /* 遊戲最外層的選擇器 */
var HY_GAME_LANG = function(){ return 'zh'; };  /* 多語遊戲改成回傳目前語言變數 */

(function(){
  var LANG_MAP = { zh:'zh-Hant', 'zh-Hant':'zh-Hant', en:'en', ja:'ja' };
  var DEBUG = /[?\x26]hy_debug=1/.test(location.search);
  var sent = {};
  var playMs = 0, visibleAt = 0;        /* 實際遊玩時間：只算分頁在前景的時間 */
  var rounds = 0, roundAt = 0, roundOpen = null;

  function lang(){ try { return LANG_MAP[HY_GAME_LANG()] || 'zh-Hant'; } catch(e){ return 'zh-Hant'; } }
  function now(){ return Date.now(); }
  function secs(ms){ return Math.round(ms / 1000); }

  function send(name, params, beacon){
    try {
      var p = {}, k, v;
      params = params || {};
      for (k in params) {
        v = params[k];
        if (v === undefined || v === null || v === '') continue;
        if (typeof v === 'boolean') v = v ? 'yes' : 'no';
        if (typeof v === 'string') v = v.slice(0, 100);   /* GA4 參數值上限 100 字元 */
        p[k] = v;
      }
      p.game_id = HY_GAME_ID;
      p.page_lang = lang();
      p.content_group = 'game';
      if (beacon) p.transport_type = 'beacon';
      if (DEBUG) { p.debug_mode = true; if (window.console) console.log('[hy-game]', name, p); }
      if (typeof window.gtag === 'function') { window.gtag('event', name, p); return; }
      window.dataLayer = window.dataLayer || [];
      (function(){ window.dataLayer.push(arguments); })('event', name, p);
    } catch(e) {}
  }

  function playedMs(){ return playMs + (visibleAt ? now() - visibleAt : 0); }

  var api = window.hyGame = {
    /* 任何事件 */
    event: send,
    /* 每次載入頁面只送一次 */
    once: function(name, params){ if (sent[name]) return; sent[name] = 1; send(name, params); },
    /* 開始玩：entry = direct／shared／saved */
    start: function(entry){
      if (sent.game_start) return;
      if (!document.hidden) visibleAt = now();
      api.once('game_start', { entry_point: entry || 'direct' });
    },
    /* 一局開始：option＝模式、level＝難度 */
    roundStart: function(params){
      api.start('direct');
      if (roundOpen) api.roundEnd({ result: 'quit' });   /* 上一局沒結束就開新局 → 記為放棄 */
      params = params || {};
      roundAt = playedMs();   /* 局的秒數同樣只算前景 */
      roundOpen = { option: params.option, level: params.level };
      send('round_start', params);
    },
    /* 一局結束：result＝complete／fail／quit／timeout，另帶 score、item_count、correct_count */
    roundEnd: function(params, beacon){
      if (!roundOpen) return;
      var p = {}, k;
      params = params || {};
      for (k in roundOpen) p[k] = roundOpen[k];
      for (k in params) p[k] = params[k];
      p.duration_sec = secs(playedMs() - roundAt);
      p.result = p.result || 'complete';
      if (p.result !== 'quit') rounds = rounds + 1;
      p.round_count = rounds;
      roundOpen = null;
      send('round_end', p, beacon);
    },
    /* 分享：method 見值域表，type = result／game */
    share: function(method, type, extra){
      var p = {}, k; extra = extra || {};
      for (k in extra) p[k] = extra[k];
      p.method = method; p.content_type = type;
      send('share', p);
    },
    /* 選填：遊戲可覆寫，替 cta_click 補參數 */
    ctaExtra: null
  };

  function inRoot(t){ if (!t || !t.closest) return null; return t.closest(HY_GAME_ROOT); }

  /* 第一次在遊戲區點擊、輸入或按鍵 → 自動 game_start（點 CTA 不算；只捲動不算） */
  function autoStart(e){
    if (sent.game_start) return;
    var t = e.target;
    if (!inRoot(t)) return;
    if (t.closest('[data-cta]')) return;
    api.start('direct');
  }
  document.addEventListener('click', autoStart, true);
  document.addEventListener('input', autoStart, true);
  document.addEventListener('keydown', autoStart, true);

  /* 點任何 [data-cta] → cta_click（與故事、工具同一個事件） */
  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;
    var a = t.closest('[data-cta]');
    if (!a) return;
    var p = {}, ex = {}, k;
    try { if (typeof api.ctaExtra === 'function') ex = api.ctaExtra(a) || {}; } catch(err) {}
    for (k in ex) p[k] = ex[k];
    p.cta_id = a.getAttribute('data-cta');
    p.cta_type = a.getAttribute('data-cta-type') || 'other';
    p.link_url = a.href || '';
    send('cta_click', p);
  }, true);

  /* 遊玩計時：切到背景暫停，回來繼續 */
  document.addEventListener('visibilitychange', function(){
    if (!sent.game_start) return;
    if (document.hidden) {
      if (visibleAt) { playMs = playMs + now() - visibleAt; visibleAt = 0; }
    } else if (!sent.game_exit) {
      visibleAt = now();
    }
  });

  /* 離開頁面 → game_exit（每次載入只送一次；沒開始玩就不送） */
  function exit(){
    if (!sent.game_start || sent.game_exit) return;
    if (roundOpen) api.roundEnd({ result: 'quit' }, true);
    sent.game_exit = 1;
    send('game_exit', { duration_sec: secs(playedMs()), round_count: rounds }, true);
  }
  window.addEventListener('pagehide', exit);
})();
/* ===== /GA4 統一追蹤 ===== */
</script>

function scene(lines,opts,done){
  opts=opts||{};let i=0;closeSheet();
  const v=document.createElement('div');v.className='veil scene-veil';v.id='veil';
  const draw=()=>{v.innerHTML=`<div class="scene" role="dialog" aria-modal="true" style="--c:${opts.c||'#FFD23F'}">
    ${opts.title?`<div class="scene-tag">${opts.title}</div>`:''}

    <div class="scene-foot"><span class="dots">${lines.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</span>
    <button class="btn dark" id="sceneBtn">${i<lines.length-1?'繼續 →':(opts.last||'出發！')}</button></div></div>`;
    $('#sceneBtn').onclick=()=>{sfx.tap();if(i<lines.length-1){i++;draw()}else{v.remove();done&&done()}};$('#sceneBtn').focus()};

}

function shareBlock(text,type){
  type=type||'game';

  const items=[['Facebook','facebook','#1877F2',`https://www.facebook.com/sharer/sharer.php?u=${u}`],['LINE','line','#06C755',`https://social-plugins.line.me/lineit/share?url=${u}&text=${t}`],['Threads','threads','#16161D',`https://www.threads.net/intent/post?text=${t}%20${u}`],['X','x','#16161D',`https://twitter.com/intent/tweet?text=${t}&url=${u}`],['Telegram','telegram','#2AABEE',`https://t.me/share/url?url=${u}&text=${t}`]];
  return`<div class="share-row">${items.map(([n,m,bg,h])=>`<a class="btn share" style="background:${bg};color:#fff" href="${h}" target="_blank" rel="noopener" onclick="T.share('${m}','${type}')">${n}</a>`).join('')}
   <button class="btn share copy" onclick="copyLink(this,'${type}')">複製連結</button></div>
   <div class="linkbox" hidden><input readonly value="${SHARE_LINK}" aria-label="分享連結"></div>`;
}
function copyLink(btn,type){T.share('copy_link',type||'game');
  const done=()=>{btn.textContent='已複製！';setTimeout(()=>{if(btn.isConnected)btn.textContent='複製連結'},1800)};
  const fallback=()=>{const b=btn.parentNode.nextElementSibling;if(b){b.hidden=false;const i=b.querySelector('input');i.focus();i.select()}btn.textContent='請手動複製'};
  try{navigator.clipboard.writeText(SHARE_LINK).then(done,fallback)}catch(e){fallback()}
}

  const s=STAGE[id];
  app.innerHTML=`<div class="top"><button class="btn small" onclick="go('chapter','${s.ch.key}')">← ${s.ch.name}</button><span class="ttl">${stageName(s)}・單字表</span><button class="btn small dark" onclick="startStage('${s.id}')">開始</button></div>
  <div class="tbl"><table><thead><tr><th></th><th>單字</th><th>讀音</th><th>羅馬拼音</th><th>中文</th><th>詞性</th>${speakOK?'<th></th>':''}</tr></thead><tbody>
  ${s.words.map(w=>`<tr><td><span class="m-dot${(P.m[w.key]||0)>=2?' on':''}" title="${(P.m[w.key]||0)>=2?'已掌握':'未掌握'}"></span></td><td class="jw">${w.w}</td><td class="jk">${w.k}</td><td class="r">${w.r}</td><td>${w.z}</td><td class="r">${POS[w.p]}</td>${speakOK?`<td><button class="say" onclick="say('${esc(w.k)}')">▶</button></td>`:''}</tr>`).join('')}
  </tbody></table></div><p class="foot">綠點＝已答對 2 次以上，算是「掌握」。</p>`;
  window.scrollTo(0,0);
}

/* ---------- questions ---------- */
function modesFor(w){const m=['jp2zh','zh2jp'];if(w.w!==w.k&&hasKanji(w.w))m.push('kana2kanji','kana2kanji');return m}
const MODE={
 jp2zh:{label:'這是什麼意思？',q:w=>w.w,a:w=>w.z,qj:true,aj:false},
 zh2jp:{label:'日文怎麼說？',q:w=>w.z,a:w=>w.w,qj:false,aj:true},
 kana2kanji:{label:'哪一個寫法對？',q:w=>w.k,a:w=>w.w,qj:true,aj:true}
};
function makeQ(w,pool){
  const mk=pick(modesFor(w));const bad=x=>x===w||x.w===w.w||x.k===w.k||x.z===w.z;
  let d=shuffle(pool.filter(x=>!bad(x)));if(mk==='kana2kanji')d=d.filter(x=>hasKanji(x.w));
  if(d.length<3)d=shuffle(roomOf(w.l).words.filter(x=>!bad(x)&&(mk!=='kana2kanji'||hasKanji(x.w))));
  const opts=[w];for(const x of d){if(opts.length>=4)break;if(!opts.some(o=>MODE[mk].a(o)===MODE[mk].a(x)))opts.push(x)}
  return{w,mk,opts:shuffle(opts)};
}
function samePosPool(w){const all=roomOf(w.l).words,p=all.filter(x=>x.p===w.p);return p.length>=8?p:all}
function baseG(o){return Object.assign({i:0,lives:3,score:0,combo:0,maxCombo:0,miss:[],xp0:P.xp,lv0:lvl()},o)}
function startStage(id){
  const s=STAGE[id],n=s.boss?15:10;stopTimers();closeSheet();
  G=baseG({type:'stage',stage:s,color:s.ch.c,title:s.ch.name+'・'+stageName(s),qs:shuffle(s.words).slice(0,n).map(w=>makeQ(w,s.boss?s.ch.words:s.words)),lockWas:lockOpen(s.ch)});
  T.roundStart(G);renderPlay();window.scrollTo(0,0);
}
function startReview(){
  const ws=shuffle(W.filter(w=>P.wrong.includes(w.key))).slice(0,10);if(!ws.length)return;stopTimers();closeSheet();
  G=baseG({type:'review',color:'#FF8CC6',title:'錯題本練習',lives:Infinity,qs:ws.map(w=>makeQ(w,samePosPool(w)))});
  T.roundStart(G);renderPlay();window.scrollTo(0,0);
}
function blitzPool(R){let ws=R.order.filter(s=>!s.boss&&P.stars[s.id]>0).flatMap(s=>s.words);if(ws.length<20)ws=R.chs.slice(0,4).flatMap(c=>c.words);return ws}
function runTimer(total){
  G.left=total;G.total=total;G.t0=Date.now();
  timerId=setInterval(()=>{if(!G||G.done){stopTimers();return}G.left=Math.max(0,total-(Date.now()-G.t0)/1000);const t=$('#tbar'),tn=$('#tnum');if(t){t.style.width=(G.left/total*100)+'%';t.parentNode.classList.toggle('low',G.left<Math.min(10,total*.15))}if(tn)tn.textContent=fmtT(G.left);if(G.left<=0){G.timeout=true;stopTimers();finish()}},100);
}
const fmtT=s=>{s=Math.ceil(s);return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s)};
function startBlitz(){
  stopTimers();closeSheet();const R=curRoom(),pool=blitzPool(R);
  G=baseG({type:'blitz',room:R.id,color:'#4CB8FF',title:R.name+'・60 秒搜查',pool,lives:Infinity,qs:[]});
  const w0=pick(pool);G.qs.push(makeQ(w0,samePosPool(w0)));G.left=60;T.roundStart(G);renderPlay();window.scrollTo(0,0);runTimer(60);
}
function startDoor(id){
  stopTimers();closeSheet();const R=roomOf(id);
  G=baseG({type:'door',room:id,color:R.c,title:`第 ${R.no} 密室・大門`,qs:shuffle(R.words).slice(0,DOOR_Q).map(w=>makeQ(w,samePosPool(w))),hints:Math.min(keysOf(R),HINT_MAX)});
  G.left=DOOR_TIME;T.roundStart(G);renderPlay();window.scrollTo(0,0);runTimer(DOOR_TIME);
}

function renderPlay(){
  const q=G.qs[G.i],m=MODE[q.mk],c=G.color,ans=q.pick!==undefined,fever=G.combo>=5,timed=G.type==='blitz'||G.type==='door';
  const hearts=(G.type==='stage'||G.type==='door')?`<span class="hearts" id="hearts">${'♥'.repeat(Math.max(G.lives,0))}<span class="e">${'♥'.repeat(3-Math.max(G.lives,0))}</span></span>`:'';
  const timer=timed?`<div class="top"><div class="timer"><span id="tbar" style="width:${G.left/(G.total||G.left||1)*100}%"></span></div><span class="tnum num" id="tnum">${fmtT(G.left)}</span></div>`:'';
  const pills=G.type!=='blitz'?`<div class="pills">${G.qs.map((x,i)=>`<span class="${x.pick!==undefined?(x.ok?'ok':'ng'):i===G.i?'cur':''}"></span>`).join('')}</div>`:'';
  app.innerHTML=`<div class="top"><button class="btn small" onclick="leave()" aria-label="離開">✕</button><span class="ttl">${G.title}</span>${hearts}</div>${timer}${pills}
  <div class="statrow">${G.combo>=2?`<span class="combo${fever?' fever':''}">${fever?'FEVER ×2 ・ ':''}${G.combo} 連擊</span>`:`<span style="color:var(--sub);font-size:13px">${G.type==='blitz'?'答對會自動跳下一題':'第 '+(G.i+1)+' / '+G.qs.length+' 題'}</span>`}
   ${G.type==='door'?`<button class="btn small hint" onclick="useHint()" ${G.hints&&!ans&&!q.hinted?'':'disabled'}>${KEYICON}提示卡 ×${G.hints}</button>`:''}<span class="score num" id="score">${G.score}</span></div>
  <section class="card" id="card" style="--c:${c}"><div class="band"><span>${m.label}</span><span class="lvtag">${q.w.l.toUpperCase()}</span><span class="m">${musubi(ans?(q.ok?'happy':'sad'):(fever?'wow':'normal'),46)}</span></div>
   <div class="body"><div class="prompt ${m.qj?'jp':'zh'}${m.q(q.w).length>7?' long':''}">${m.q(q.w)}</div>
   ${speakOK&&m.qj?`<button class="say" onclick="say('${esc(q.w.k)}')">▶ 聽發音</button>`:''}</div></section>
  <div class="opts">${q.opts.map((o,i)=>{let cl='opt'+(m.aj?' jpa':'');const gone=q.hinted&&q.hinted.includes(i);if(ans){cl+=o===q.w?' right':i===q.pick?' wrong':' dim'}else if(gone)cl+=' dim';
    return`<button class="${cl}" onclick="answer(${i},event)" ${ans||gone?'disabled':''}><kbd>${i+1}</kbd>${m.a(o)}</button>`}).join('')}</div>
  ${ans&&!timed?feedback(q):''}`;
  if(ans&&!timed){const b=$('#nextBtn');if(b)b.focus({preventScroll:true})}
}
function useHint(){if(!G||!G.hints)return;const q=G.qs[G.i];if(q.pick!==undefined||q.hinted)return;const wrongs=q.opts.map((o,i)=>i).filter(i=>q.opts[i]!==q.w);q.hinted=shuffle(wrongs).slice(0,2);G.hints--;sfx.unlock();renderPlay()}
function feedback(q){
  const w=q.w,last=isLast();
  return`<div class="fb ${q.ok?'ok':'ng'}" role="status"><span class="h">${q.ok?pick(['正解！','すごい！','いいね！','その調子！']):'差一點！記住它：'}</span>
   <div class="w"><span class="jp big">${w.w}</span>${w.k!==w.w?`<span class="jp k">${w.k}</span>`:''}<span class="r">${w.r}</span></div>
   <div class="z">${w.z}<span class="pos">${POS[w.p]}</span></div>
   <div class="a"><button class="btn dark" id="nextBtn" onclick="next()">${last?'看結果':'下一題'} →</button>${speakOK?`<button class="btn small" onclick="say('${esc(w.k)}')">▶ 發音</button>`:''}</div></div>`;
}
function isLast(){return G.type!=='blitz'&&(G.lives<=0||G.i>=G.qs.length-1)}
function floatText(txt,r){const f=document.createElement('div');f.className='float';f.textContent=txt;r=r||{left:innerWidth/2,width:0,top:innerHeight/2};f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top-10)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),950)}
function answer(i,ev){
  if(!G||G.done)return;const q=G.qs[G.i];if(q.pick!==undefined||(q.hinted&&q.hinted.includes(i)))return;
  const rect=ev&&ev.currentTarget&&ev.currentTarget.getBoundingClientRect?ev.currentTarget.getBoundingClientRect():null;
  q.pick=i;q.ok=q.opts[i]===q.w;touchDay();T.milestone();
  if(q.ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);const fever=G.combo>=5;const pts=(100+(G.combo-1)*10)*(fever?2:1);G.score+=pts;P.xp+=fever?15:10;
    P.m[q.w.key]=(P.m[q.w.key]||0)+1;if(G.type==='review')P.wrong=P.wrong.filter(x=>x!==q.w.key);sfx.ok(G.combo);floatText('+'+pts,rect);}
  else{G.combo=0;if(G.type==='stage'||G.type==='door')G.lives--;G.miss.push(q.w);if(!P.wrong.includes(q.w.key))P.wrong.push(q.w.key);sfx.ng();}
  save();renderPlay();renderHUD();
  const card=$('#card');if(card)card.classList.add(q.ok?'pop':'shake');
  if(!q.ok){const h=$('#hearts');if(h)h.classList.add('hit')}
  if(G.type==='blitz'){autoId=setTimeout(()=>{if(!G||G.done)return;const w=pick(G.pool);G.qs.push(makeQ(w,samePosPool(w)));G.i++;renderPlay()},q.ok?350:900)}
  else if(G.type==='door'){autoId=setTimeout(()=>{if(!G||G.done)return;if(isLast())finish();else{G.i++;renderPlay()}},q.ok?450:1100)}
  else if(q.ok&&!isLast()){autoId=setTimeout(()=>{if(G&&G.qs[G.i]===q)next()},1300)}
}
function next(){if(!G||G.done)return;clearTimeout(autoId);const q=G.qs[G.i];if(q.pick===undefined)return;if(isLast()){finish();return}G.i++;renderPlay()}
function leave(){if(G&&G.qs.some(q=>q.pick!==undefined)&&!G.confirmLeave){G.confirmLeave=true;const b=document.querySelector('.top .btn');if(b){b.textContent='確定離開？';setTimeout(()=>{if(G){G.confirmLeave=false;if(b.isConnected)b.textContent='✕'}},2500)}return}
  const back=G&&G.stage?['chapter',G.stage.ch.key]:G&&G.room?['room',G.room]:['hall'];go(back[0],back[1])}

function finish(){
  if(!G||G.done)return;stopTimers();G.done=true;
  const done=G.qs.filter(q=>q.pick!==undefined),right=done.filter(q=>q.ok).length;
  let stars=0,cleared=true,title,mood='happy',shareText,note='',escapedNow=false,keyNow=false;
  if(G.type==='stage'){
    cleared=G.lives>0;const m=G.miss.length;stars=cleared?(m===0?3:m===1?2:1):0;
    if(cleared){P.xp+=30+stars*10;if(stars>(P.stars[G.stage.id]||0))P.stars[G.stage.id]=stars}
    keyNow=!G.lockWas&&lockOpen(G.stage.ch);
    title=keyNow?'鎖打開了！':cleared?(stars===3?'完美通關！':'線索到手！'):'再試一次！';mood=cleared?(stars===3||keyNow?'wow':'happy'):'sad';
    if(keyNow)note=`你拿到了「${G.stage.ch.name}」的鑰匙，挑戰大門時可以多一張提示卡。`;
    shareText=`我在 JLPT 單字密室解開了「${G.stage.ch.name}」${keyNow?'這道鎖':'的'+stageName(G.stage)}，拿到 ${'★'.repeat(stars)||'0 顆星'}！`;
  }else if(G.type==='door'){
    const R=roomOf(G.room);cleared=G.lives>0&&!G.timeout&&done.length===G.qs.length;
    P.doorBest[R.id]=Math.max(P.doorBest[R.id]||0,right);
    if(cleared){P.xp+=150;if(!P.escaped[R.id]){P.escaped[R.id]=true;escapedNow=true}}
    title=cleared?'逃脫成功！':G.timeout?'時間到，門又鎖上了':'被困住了……';mood=cleared?'wow':'sad';
    const nxt=ROOMS[R.no];
    note=cleared?(nxt?(nxt.ready?`第 ${nxt.no} 間密室「${nxt.name}」的門打開了。`:`第 ${nxt.no} 間密室「${nxt.name}」還在建造中，完成後會自動開放。`):'你逃出了言の葉館！'):'多開幾道鎖、拿更多提示卡再來。';
    shareText=cleared?`我逃出了 JLPT 單字密室的第 ${R.no} 間「${R.name}」（${R.id.toUpperCase()}）！你能逃出幾間？`:`我在 JLPT 單字密室第 ${R.no} 間的大門答對 ${right} 題，差一點就逃出去了！`;
  }else if(G.type==='blitz'){
    P.xp+=right*5;const best=G.score>(P.best[G.room]||0);if(best)P.best[G.room]=G.score;G.newBest=best;title=best?'新紀錄！':'時間到！';mood=best?'wow':'happy';
    shareText=`我在 JLPT 單字密室的 60 秒搜查答對 ${right} 題、拿到 ${G.score} 分，你能超過我嗎？`;
  }else{title=right===done.length?'全部答對！':'複習完成';shareText='我在 JLPT 單字密室複習日文單字，一起來逃出密室！'}
  save();
  T.roundEnd(G,G.type==='stage'?(cleared?'complete':'fail'):G.type==='door'?(cleared?'complete':(G.timeout?'timeout':'fail')):'complete');
  if(keyNow)T.ev('game_unlock',{option:'key_'+G.stage.ch.key.replace('-','_')});
  if(escapedNow)T.ev('game_unlock',{option:'escape_'+T.lvCode(G.room)});
  const lvUp=lvl()>G.lv0,gained=P.xp-G.xp0,s=G.stage;
  const nx=G.type==='stage'&&cleared?nextStage(roomOf(s.ch.lv)):null;
  const again=G.type==='stage'?`startStage('${s.id}')`:G.type==='blitz'?'startBlitz()':G.type==='door'?`startDoor('${G.room}')`:'startReview()';
  const backBtn=G.type==='stage'?`<button class="btn big" onclick="go('chapter','${s.ch.key}')">回機關鎖</button>`:G.room?`<button class="btn big" onclick="go('room','${G.room}')">回密室</button>`:`<button class="btn big" onclick="go('hall')">回館內地圖</button>`;
  const nextRoom=escapedNow&&ROOMS[roomOf(G.room).no]&&ROOMS[roomOf(G.room).no].ready?ROOMS[roomOf(G.room).no]:null;
  const good=cleared&&(G.type!=='stage'||stars>0);
  app.innerHTML=`<section class="result">
   <div class="mascot">${musubi(mood,110)}</div><h1>${title}</h1>
   ${G.type==='stage'?`<div class="bigstars">${[0,1,2].map(i=>`<span class="${i<stars?'on':''}">★</span>`).join('')}</div>`:''}
   ${note?`<p class="rnote">${note}</p>`:''}
   ${lvUp?`<div class="lvup">升級！Lv.${lvl()} ${rank(lvl())}</div>`:''}
   <div class="tiles"><div><b class="num">${G.score}</b><span>分數</span></div><div><b class="num">${right}/${done.length}</b><span>答對</span></div><div><b class="num">+${gained}</b><span>經驗值</span></div></div>
   ${G.miss.length?`<div class="miss"><h3>這次答錯的字（已收進錯題本）</h3><ul>${G.miss.map(w=>`<li><span class="jp">${w.w}</span><span class="jp">${w.k}</span><span>${w.z}</span></li>`).join('')}</ul></div>`:''}
   <div class="ract">${nextRoom?`<button class="btn big dark" onclick="go('room','${nextRoom.id}')">前往第 ${nextRoom.no} 密室 →</button>`:''}${nx?`<button class="btn big dark" onclick="openStage('${nx.id}')">下一條線索 →</button>`:''}
    <button class="btn big yellow" onclick="${again}">${cleared?'再玩一次':'再挑戰'}</button>${backBtn}</div>
   ${good&&(escapedNow||keyNow||(G.type==='door'&&cleared))?tripCard(G.type==='door'?G.room:G.stage.ch.lv):''}
   ${good?`<div class="share-result"><span>分享給朋友：</span>${shareBlock(shareText,'result')}</div>`:''}
  </section>`;
  renderHUD();window.scrollTo(0,0);
  if(good){sfx.win();if(stars===3||keyNow||escapedNow||lvUp||G.newBest)confetti()}else sfx.lose();
  if(escapedNow){const R=roomOf(G.room);if(R.outro.length)setTimeout(()=>scene(R.outro,{title:`第 ${R.no} 密室・脫出`,c:R.c,mood:'wow',last:'繼續'}),900)}
}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti');cv.hidden=false;const x=cv.getContext('2d');const dpr=devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#FFD23F','#4CB8FF','#FF8CC6','#3DDC97','#FF7A7A','#B18CFF','#16161D'];
  const ps=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,s:Math.random()*8+5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)}));
  let f=0;(function tick(){x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<150&&!cv.hidden)requestAnimationFrame(tick);else{x.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true}})();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('.scene-veil')){closeSheet();return}
  if(!G||G.done||$('#veil'))return;const q=G.qs[G.i];
  if(q.pick===undefined&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];answer(+e.key-1,{currentTarget:b})}
  else if(q.pick!==undefined&&e.key==='Enter'&&G.type!=='blitz'&&G.type!=='door'){e.preventDefault();next()}
});
renderHUD();renderHall();
try{if(/[?\x26]ref=share/.test(location.search)&&window.hyGame)window.hyGame.start('shared')}catch(e){}
function playPrologue(first){T.ev('tutorial_begin');scene(PROLOGUE,{title:'序章',mood:'happy',last:first?'出發！':'知道了'},()=>T.ev('tutorial_complete'))}
if(!P.seen.prologue){P.seen.prologue=1;save();playPrologue(true)}
</script>
