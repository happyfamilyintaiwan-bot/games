.pair{display:grid;grid-template-columns:auto auto 1fr;gap:8px 10px;align-items:center;font-size:16px}

.tag.e{background:var(--east)} .tag.w{background:var(--west)} .tag.z{background:var(--muted)}
.pair .v{font-weight:700}
.note{font-size:14px;color:var(--muted);margin:0}
.next{font-weight:900;align-self:flex-end;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:11px 24px;cursor:pointer;font-size:15px}

.big{font-family:var(--display);font-size:68px;line-height:1;font-variant-numeric:tabular-nums}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}

/* start */
.start{align-items:center;text-align:center}
.rules{display:grid;gap:8px;text-align:left;width:100%;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.rules b.k{flex:none;font-family:var(--mono);background:var(--gold);border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;font-size:12px}

/* glossary */
.gl{width:100%;border-collapse:collapse;font-size:15px}
.gl th{font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:700;padding:8px;border-bottom:2px solid var(--ink)}
.gl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.cell{display:flex;align-items:center;gap:8px;font-weight:700}
.gl td.e .cell{color:var(--east)} .gl td.w .cell{color:var(--west)}
.gl td.z small{display:block;color:var(--muted);font-size:12px}
.gl-wrap{overflow-x:auto}
.foot{font-size:12px;color:var(--muted);margin:0}

.trip{width:100%;border:2px solid var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--west-soft);margin-top:6px}
.trip p{margin:0;font-weight:700;font-size:15px;text-wrap:balance}
.trip a{display:inline-block;background:var(--west);color:#fff;font-weight:900;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:10px 22px;box-shadow:3px 3px 0 var(--ink)}
.trip a:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.trip small{font-size:11px;color:var(--muted)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  <p class="foot">發音是預先合成、內建在頁面裡的音檔，以標準語的語調朗讀，所以關西腔的「用詞」聽得到，但關西特有的語調無法完整重現。iPhone 若開著靜音鍵會聽不到，請先關掉靜音。東京話與標準語很接近，這裡以「關東」代稱標準語；關西腔以大阪腔為主。</p>

let CAN=true,player=null,curBtn=null;
function applyAudio(){renderGlossary()}
function initAudio(){applyAudio()}
function say(text,btn){
  const src=AUDIO[text];if(!src)return;
  try{if(player){player.pause()}}catch(e){}
  if(curBtn)curBtn.classList.remove('playing');
  player=new Audio(src);curBtn=btn||null;
  if(btn)btn.classList.add('playing');
  const done=()=>{if(btn)btn.classList.remove('playing')};
  player.onended=done;player.onerror=done;
  const p=player.play();
  if(p&&p.catch)p.catch(()=>{done()});
}
let toastT;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:10;max-width:90vw';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3000)}
document.addEventListener('click',e=>{const b=e.target.closest('.spk');if(b)say(b.dataset.say,b)});
const spk=(t,cls='')=>CAN?`<button class="spk ${cls}" data-say="${esc(t)}" aria-label="播放發音：${esc(t)}">${SPK}</button>`:'';

/* ---------- confetti ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function burst(x,y,n=40){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#1d57b8','#d7372a','#f5b700','#14864f','#111'];
  for(let k=0;k<n;k++)parts.push({x,y,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:4+Math.random()*5,c:cols[k%5],r:Math.random()*6,life:60+Math.random()*30});
  if(!raf)tick();
}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

/* ---------- game ---------- */
let best=0;try{best=+localStorage.getItem('tozai-best2')||0}catch(e){}
let Q=[],i=0,score=0,combo=0,maxCombo=0,lives=3,log=[],timer=null,left=TIME,locked=false;

function build(){
  const ps=shuffle(PAIRS),qs=[];
  const opt=(p,key)=>{const o=shuffle([p[key],...shuffle(PAIRS.filter(x=>x!==p)).slice(0,3).map(x=>x[key])]);return{opts:o,ans:o.indexOf(p[key])}};
  for(let n=0;n<3;n++){const p=ps[n],k=Math.random()<.5;qs.push({t:'side',p,show:k?p.k:p.s,ans:k?1:0})}
  for(let n=3;n<5;n++){const p=ps[n],k=Math.random()<.5;qs.push({t:CAN?'ear':'side',p,show:k?p.k:p.s,ans:k?1:0})}
  for(let n=5;n<7;n++){const p=ps[n];qs.push({t:'k2s',p,...opt(p,'s')})}
  qs.push({t:'s2k',p:ps[7],...opt(ps[7],'k')});
  shuffle(TRIVIA).slice(0,2).forEach(tv=>{const idx=shuffle([0,1]);qs.push({t:'tri',tv,opts:idx.map(k=>tv.o[k]),ans:idx.indexOf(tv.a)})});
  return shuffle(qs);
}
function hud(){
  const hot=combo>=2;
  return `<div class="hud">
    <div class="stat"><small>分數</small><b id="sc">${score}</b></div>
    <div class="stat combo ${hot?'hot':''}"><small>連擊</small><b id="cb">${combo}${hot?' ×'+mult():''}</b></div>
    <div class="stat"><small>生命</small><b class="lives">${'♥'.repeat(lives)}<span style="color:var(--line)">${'♥'.repeat(3-lives)}</span></b></div>
  </div>
  <div class="pips">${Array.from({length:10},(_,k)=>`<div class="pip ${k<log.length?(log[k]?'ok':'bad'):k===i?'now':''}"></div>`).join('')}</div>`;
}
const mult=()=>combo>=5?3:combo>=3?2:combo>=2?1.5:1;

function startScreen(){
  $('#game').innerHTML=`<div class="card start">
    <div class="mascot" style="font-size:28px">${MAS.idle}</div>
    <div class="qtext">東京還是大阪？用耳朵和眼睛一起分辨</div>
    <ul class="rules">
      <li><b class="k">15s</b>每題 15 秒，答得越快加分越多</li>
      <li><b class="k">連擊</b>連續答對 2／3／5 題，分數 ×1.5／×2／×3</li>
      <li><b class="k">♥×3</b>答錯或超時扣一條命，3 條用完提早結束</li>
      ${CAN?'<li><b class="k">聽力</b>有些題目只有聲音，聽完再選</li>':''}
    </ul>
    <button class="next" id="go" style="align-self:center;font-size:18px;padding:13px 36px">開始！</button>
  </div>`;
  $('#go').addEventListener('click',start);
}
function start(){Q=build();i=0;score=0;combo=0;maxCombo=0;lives=3;log=[];try{hyGame.roundStart({option:'mixed'})}catch(e){}render()}

function render(){
  if(i>=Q.length||lives<=0)return result();
  locked=false;const q=Q[i];let kind,body;
  if(q.t==='side'){kind='東還是西？';body=`<div class="stage"><div class="phrase" lang="ja">${esc(q.show)}</div>${spk(q.show)}</div>`}
  else if(q.t==='ear'){kind='聽力題';body=`<div class="stage">${spk(q.show,'big')}</div><div class="qtext" style="font-size:15px;color:var(--muted)">聽聽看，這是哪一邊的說法？</div>`}
  else if(q.t==='k2s'){kind='関西 → 標準語';body=`<div class="stage"><div class="phrase" lang="ja" style="color:var(--west)">${esc(q.p.k)}</div>${spk(q.p.k)}</div>`}
  else if(q.t==='s2k'){kind='標準語 → 関西';body=`<div class="stage"><div class="phrase" lang="ja" style="color:var(--east)">${esc(q.p.s)}</div>${spk(q.p.s)}</div>`}
  else{kind='東西冷知識';body=`<div class="qtext">${esc(q.tv.q)}</div>`}
  let ch;
  if(q.t==='side'||q.t==='ear')ch=`<div class="choices two"><button class="ch east" data-i="0">関東<small>東京・標準語</small></button><button class="ch west" data-i="1">関西<small>大阪腔</small></button></div>`;
  else ch=`<div class="choices ${q.t==='tri'?'two':'four'}">${q.opts.map((o,k)=>`<button class="ch" lang="ja" data-i="${k}">${esc(o)}</button>`).join('')}</div>`;
  $('#game').innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">${hud()}
    <div class="timer" id="tm"><i id="tb"></i></div>
    <div class="card" id="card"><div class="top"><span class="kind">Q${i+1}　${kind}</span><span class="mascot" id="ms">${q.t==='ear'?MAS.wait:MAS.idle}</span></div>${body}${ch}<div id="ex"></div></div></div>`;
  document.querySelectorAll('.ch').forEach(b=>b.addEventListener('click',e=>answer(+b.dataset.i,e)));
  if(CAN&&$('#auto').checked&&q.t!=='tri'){const b=document.querySelector('.card .spk');if(b)say(b.dataset.say,b)}
  startTimer();
}
function startTimer(){
  clearInterval(timer);left=TIME;const t0=performance.now();
  timer=setInterval(()=>{left=TIME-(performance.now()-t0)/1000;const bar=$('#tb');if(!bar)return clearInterval(timer);
    bar.style.width=Math.max(0,left/TIME*100)+'%';$('#tm').classList.toggle('low',left<5);
    if(left<=0){clearInterval(timer);answer(-1)}},100);
}
function answer(k,ev){
  if(locked)return;locked=true;clearInterval(timer);
  const q=Q[i],ok=k===q.ans;let gain=0;
  if(ok){combo++;maxCombo=Math.max(maxCombo,combo);gain=Math.round((100+Math.max(0,Math.round(left))*10)*mult());score+=gain}
  else{combo=0;lives--}
  log.push(ok);
  document.querySelectorAll('.ch').forEach(b=>{b.disabled=true;const n=+b.dataset.i;if(n===q.ans)b.classList.add('right');else if(n===k)b.classList.add('wrong')});
  const card=$('#card');card.classList.add(ok?'glow':'shake');
  $('#ms').textContent=ok?(combo>=3?MAS.fire:MAS.ok):MAS.bad;
  if(ok){const r=(ev&&ev.currentTarget||card).getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,combo>=3?70:36)}
  let detail;
  if(q.t==='tri')detail=`<p class="note">${esc(q.tv.n)}</p>`;
  else detail=`<div class="pair"><span class="tag e">関東</span><span>${spk(q.p.s,'sm')}</span><span class="v" lang="ja">${esc(q.p.s)}</span><span class="tag w">関西</span><span>${spk(q.p.k,'sm')}</span><span class="v" lang="ja">${esc(q.p.k)}</span><span class="tag z">中文</span><span></span><span class="v">${esc(q.p.z)}</span></div><p class="note">${esc(q.p.n)}</p>`;
  const msg=k===-1?'時間到！':ok?(combo>=3?`${combo} 連擊！めっちゃすごい`:'正解！ええやん'):'あかん…答錯了';
  const end=i===Q.length-1||lives<=0;
  $('#ex').outerHTML=`<div class="explain"><div class="verdict ${ok?'ok':'bad'}">${msg}${ok?`<span class="gain">+${gain}</span>`:''}</div>${detail}<button class="next" id="nx">${end?'看結果 →':'下一題 →'}</button></div>`;
  document.querySelector('.hud').outerHTML=hud().split('<div class="pips">')[0];
  document.querySelector('.pips').outerHTML='<div class="pips">'+hud().split('<div class="pips">')[1];
  const cb=$('#cb');if(cb)cb.classList.add('pop');
  if(q.t==='ear'&&$('#auto').checked){}
  const nx=$('#nx');nx.focus({preventScroll:true});nx.addEventListener('click',()=>{try{if(player)player.pause()}catch(e){}i++;render()});
}
function result(){
  clearInterval(timer);const correct=log.filter(Boolean).length;
  try{hyGame.roundEnd({result:lives<=0?'fail':'complete',score:score,item_count:log.length,correct_count:correct})}catch(e){}
  const newBest=score>best;if(newBest){best=score;try{localStorage.setItem('tozai-best2',best)}catch(e){}}
  const stamp=correct>=9?'浪速の達人':correct>=7?'かなりやるやん':correct>=4?'まあまあやな':'しゃあない、もう一回';
  $('#game').innerHTML=`<div class="card result">
    <div class="mascot" style="font-size:28px">${correct>=7?MAS.fire:correct>=4?MAS.ok:MAS.bad}</div>
    <div class="stamp" lang="ja">${stamp}</div>
    <div class="big">${score}</div>
    <div style="color:var(--muted);font-size:13px">${newBest?'新紀錄！':'最佳紀錄 '+best}${lives<=0?'　・生命用完提早結束':''}</div>
    <div class="summary">
      <div class="stat"><small>答對</small><b>${correct}/${log.length}</b></div>
      <div class="stat"><small>最高連擊</small><b>${maxCombo}</b></div>
      <div class="stat"><small>剩餘生命</small><b class="lives">${'♥'.repeat(Math.max(0,lives))||'—'}</b></div>
    </div>
    <button class="next" id="again" style="align-self:center;font-size:17px;padding:12px 32px">再玩一回</button>
    <div class="trip">
      <p>學會關西腔了，下一步去大阪實際講講看</p>
      <a href="https://trip.tpk.ro/8p6Svq9z" target="_blank" rel="sponsored noopener" data-cta="result_card" data-cta-type="affiliate">看大阪機票・住宿・景點・玩樂 →</a>
      <small>Trip.com 聯盟連結，透過連結訂購本站會獲得少量分潤，不影響你的價格。</small>
    </div>
  </div>`;
  if(correct>=7)setTimeout(()=>burst(innerWidth/2,innerHeight/3,120),200);
  $('#again').addEventListener('click',start);
}

/* glossary */
function renderGlossary(){$('#gl-body').innerHTML=PAIRS.map(p=>`<tr><td class="e"><div class="cell">${spk(p.s,'sm')}<span lang="ja">${esc(p.s)}</span></div></td><td class="w"><div class="cell">${spk(p.k,'sm')}<span lang="ja">${esc(p.k)}</span></div></td><td class="z">${esc(p.z)}<small>${esc(p.n)}</small></td></tr>`).join('')}
function tab(w){const g=w==='game';$('#tab-game').setAttribute('aria-selected',g);$('#tab-list').setAttribute('aria-selected',!g);$('#game').hidden=!g;$('#list').hidden=g}
$('#tab-game').addEventListener('click',()=>tab('game'));
$('#tab-list').addEventListener('click',()=>tab('list'));
initAudio();
startScreen();
</script>
<script>
/* ===== 編織日和遊戲｜GA4 統一追蹤 v1.0 =====
   各遊戲完全相同，只改最上面三行。規範：games-ga4-guideline
   注意：整段不含「和號」字元與雙斜線註解，新增程式時請維持 */
var HY_GAME_ID = 'tozai_dojo';  /* 遊戲登記表的 game_id */
var HY_GAME_ROOT = '#game';  /* 遊戲最外層的選擇器 */
var HY_GAME_LANG = function(){ return 'zh'; };  /* 多語遊戲改成回傳目前語言變數 */

(function(){
  var LANG_MAP = { zh:'zh-Hant', 'zh-Hant':'zh-Hant', en:'en', ja:'ja' };
  var DEBUG = /[?\x26]hy_debug=1/.test(location.search);
  var sent = {};
  var playMs = 0, visibleAt = 0;        /* 實際遊玩時間：只算分頁在前景的時間 */
  var rounds = 0, roundAt = 0, roundOpen = null;

  function lang(){ try { return LANG_MAP[HY_GAME_LANG()] || 'zh-Hant'; } catch(e){ return 'zh-Hant'; } }
  function now(){ return Date.now(); }
  function secs(ms){ return Math.round(ms / 1000); }

  function send(name, params, beacon){
    try {
      var p = {}, k, v;
      params = params || {};
      for (k in params) {
        v = params[k];
        if (v === undefined || v === null || v === '') continue;
        if (typeof v === 'boolean') v = v ? 'yes' : 'no';
        if (typeof v === 'string') v = v.slice(0, 100);   /* GA4 參數值上限 100 字元 */
        p[k] = v;
      }
      p.game_id = HY_GAME_ID;
      p.page_lang = lang();
      p.content_group = 'game';
      if (beacon) p.transport_type = 'beacon';
      if (DEBUG) { p.debug_mode = true; if (window.console) console.log('[hy-game]', name, p); }
      if (typeof window.gtag === 'function') { window.gtag('event', name, p); return; }
      window.dataLayer = window.dataLayer || [];
      (function(){ window.dataLayer.push(arguments); })('event', name, p);
    } catch(e) {}
  }

  function playedMs(){ return playMs + (visibleAt ? now() - visibleAt : 0); }

  var api = window.hyGame = {
    /* 任何事件 */
    event: send,
    /* 每次載入頁面只送一次 */
    once: function(name, params){ if (sent[name]) return; sent[name] = 1; send(name, params); },
    /* 開始玩：entry = direct／shared／saved */
    start: function(entry){
      if (sent.game_start) return;
      if (!document.hidden) visibleAt = now();
      api.once('game_start', { entry_point: entry || 'direct' });
    },
    /* 一局開始：option＝模式、level＝難度 */
    roundStart: function(params){
      api.start('direct');
      if (roundOpen) api.roundEnd({ result: 'quit' });   /* 上一局沒結束就開新局 → 記為放棄 */
      params = params || {};
      roundAt = playedMs();   /* 局的秒數同樣只算前景 */
      roundOpen = { option: params.option, level: params.level };
      send('round_start', params);
    },
    /* 一局結束：result＝complete／fail／quit／timeout，另帶 score、item_count、correct_count */
    roundEnd: function(params, beacon){
      if (!roundOpen) return;
      var p = {}, k;
      params = params || {};
      for (k in roundOpen) p[k] = roundOpen[k];
      for (k in params) p[k] = params[k];
      p.duration_sec = secs(playedMs() - roundAt);
      p.result = p.result || 'complete';
      if (p.result !== 'quit') rounds = rounds + 1;
      p.round_count = rounds;
      roundOpen = null;
      send('round_end', p, beacon);
    },
    /* 分享：method 見值域表，type = result／game */
    share: function(method, type, extra){
      var p = {}, k; extra = extra || {};
      for (k in extra) p[k] = extra[k];
      p.method = method; p.content_type = type;
      send('share', p);
    },
    /* 選填：遊戲可覆寫，替 cta_click 補參數 */
    ctaExtra: null
  };

  function inRoot(t){ if (!t || !t.closest) return null; return t.closest(HY_GAME_ROOT); }

  /* 第一次在遊戲區點擊、輸入或按鍵 → 自動 game_start（點 CTA 不算；只捲動不算） */
  function autoStart(e){
    if (sent.game_start) return;
    var t = e.target;
    if (!inRoot(t)) return;
    if (t.closest('[data-cta]')) return;
    api.start('direct');
  }
  document.addEventListener('click', autoStart, true);
  document.addEventListener('input', autoStart, true);
  document.addEventListener('keydown', autoStart, true);

  /* 點任何 [data-cta] → cta_click（與故事、工具同一個事件） */
  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;
    var a = t.closest('[data-cta]');
    if (!a) return;
    var p = {}, ex = {}, k;
    try { if (typeof api.ctaExtra === 'function') ex = api.ctaExtra(a) || {}; } catch(err) {}
    for (k in ex) p[k] = ex[k];
    p.cta_id = a.getAttribute('data-cta');
    p.cta_type = a.getAttribute('data-cta-type') || 'other';
    p.link_url = a.href || '';
    send('cta_click', p);
  }, true);

  /* 遊玩計時：切到背景暫停，回來繼續 */
  document.addEventListener('visibilitychange', function(){
    if (!sent.game_start) return;
    if (document.hidden) {
      if (visibleAt) { playMs = playMs + now() - visibleAt; visibleAt = 0; }
    } else if (!sent.game_exit) {
      visibleAt = now();
    }
  });

  /* 離開頁面 → game_exit（每次載入只送一次；沒開始玩就不送） */
  function exit(){
    if (!sent.game_start || sent.game_exit) return;
    if (roundOpen) api.roundEnd({ result: 'quit' }, true);
    sent.game_exit = 1;
    send('game_exit', { duration_sec: secs(playedMs()), round_count: rounds }, true);
  }
  window.addEventListener('pagehide', exit);
})();
/* ===== /GA4 統一追蹤 ===== */
</script>
</body>
</html>
